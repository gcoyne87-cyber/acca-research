name: Daily Build Safety Net

# Runs 10 minutes after Netlify's 09:30 UTC scheduled build. If daily:report:{today}
# already exists in Redis with cards, Netlify's scheduler worked — stand down, no
# duplicate build, no double email. If it's missing, trigger the unscheduled test
# twin (daily-build-test-background.js) as a fallback so cards still land by ~10:45
# Irish time. This does NOT touch the heartbeat tripwires in daily-build-background.js
# — those keep recording whether Netlify's own scheduler actually fired, so this net
# adds a fallback without hiding the underlying evidence.
#
# Also checks build:lock:{today} (AUDIT-DAILY-INTELLIGENCE.md, finding C2): if a
# build is already mid-flight — Netlify's scheduled run just happens to be a slow
# one — the report may not exist yet even though nothing has actually failed.
# Standing down on a fresh lock avoids firing a second, redundant build on top of
# a still-running one.

on:
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch: {}

jobs:
  safety-net:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether today's report already exists or a build is in progress
        id: check
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking daily:report:$TODAY and build:lock:$TODAY"

          REPORT_RESPONSE=$(curl -s -H "Authorization: Bearer $UPSTASH_TOKEN" \
            "$UPSTASH_URL/get/daily%3Areport%3A$TODAY")
          LOCK_RESPONSE=$(curl -s -H "Authorization: Bearer $UPSTASH_TOKEN" \
            "$UPSTASH_URL/get/build%3Alock%3A$TODAY")

          # Item count alone isn't proof today's build ran: daily:report:{today} is
          # also where YESTERDAY's tomorrow-preview pass writes its cards (same key,
          # since today's date was "tomorrow" as of last night). If today's own
          # 09:30 build never overwrites it, this key can sit there non-empty all
          # day with no real same-day content — an item-count-only check reads that
          # as success and wrongly stands down. Require generatedAt to actually be
          # today's UTC date before trusting the count. (2026-08-02: this exact scenario
          # happened live — Netlify's scheduler silently didn't fire, and this stale
          # leftover made the safety net stand down instead of triggering the fallback.)
          ITEMS=$(TODAY="$TODAY" node -e '
            let data = "";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              try {
                const raw = JSON.parse(data);
                if (!raw.result) { console.log(0); return; }
                const report = JSON.parse(raw.result);
                const genDate = (report.generatedAt || "").slice(0, 10);
                if (genDate !== process.env.TODAY) { console.log(0); return; }
                const items = Array.isArray(report.intelligence) ? report.intelligence : [];
                const n = items.filter(function(it) { return it && it.isTomorrow !== true; }).length;
                console.log(n);
              } catch (e) { console.log(0); }
            });
          ' <<< "$REPORT_RESPONSE")

          LOCK_ACTIVE=$(node -e '
            let data = "";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              try {
                const raw = JSON.parse(data);
                if (!raw.result) { console.log("false"); return; }
                const lock = JSON.parse(raw.result);
                if (!lock || !lock.startedAt) { console.log("false"); return; }
                const ageMs = Date.now() - new Date(lock.startedAt).getTime();
                console.log(ageMs >= 0 && ageMs < 30 * 60 * 1000 ? "true" : "false");
              } catch (e) { console.log("false"); }
            });
          ' <<< "$LOCK_RESPONSE")

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "items=$ITEMS" >> "$GITHUB_OUTPUT"
          echo "lockActive=$LOCK_ACTIVE" >> "$GITHUB_OUTPUT"
          if [ "$ITEMS" -gt 0 ] || [ "$LOCK_ACTIVE" = "true" ]; then
            echo "standDown=true" >> "$GITHUB_OUTPUT"
          else
            echo "standDown=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stand down — report already exists or a build is in progress
        if: steps.check.outputs.standDown == 'true'
        run: |
          if [ "${{ steps.check.outputs.items }}" -gt 0 ]; then
            echo "daily:report:${{ steps.check.outputs.today }} already has ${{ steps.check.outputs.items }} card(s). Netlify's scheduled build ran — nothing to do."
          else
            echo "build:lock:${{ steps.check.outputs.today }} shows a build already in progress — standing down to avoid a duplicate."
          fi

      - name: Trigger fallback build — no report found and no build in progress
        if: steps.check.outputs.standDown != 'true'
        env:
          BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
        run: |
          set -euo pipefail
          echo "No report found for ${{ steps.check.outputs.today }} — Netlify's 09:30 UTC scheduler appears to have failed. Triggering the fallback build."

          HTTP_STATUS=$(curl -s -o /tmp/fallback_response.json -w "%{http_code}" -X POST \
            -H "x-build-secret: $BUILD_SECRET" \
            "https://superlative-flan-93dfc4.netlify.app/.netlify/functions/daily-build-test-background")

          echo "Fallback build trigger returned HTTP $HTTP_STATUS"
          cat /tmp/fallback_response.json || true

          if [ "$HTTP_STATUS" != "202" ]; then
            echo "::error::Fallback build trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "::warning::Netlify's scheduled build did not run today — fallback triggered via GitHub Actions. Cards should land within ~15 minutes."
