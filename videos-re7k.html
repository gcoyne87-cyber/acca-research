<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RE Videos">
<title>Racing Edge — Video Feed</title>
<style>
  :root {
    --navy: #0b1628; --gold: #c9a84c; --green: #1e9e6b;
    --bg: #f5f7fb; --card: #ffffff; --line: #e5e9ef;
    --grey: #6b7686; --grey-light: #9aa3b0; --thumb: #dfe4ec;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--navy);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.4;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 1280px; margin: 0 auto; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 0 6px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy); }
  .wordmark span { color: var(--gold); }
  .pill-research { background: var(--navy); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 4px 9px; border-radius: 999px; }

  .sub { padding: 14px 0 12px; }
  .sub h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }

  /* ── Paste-any-link row ── */
  .paste { display: flex; gap: 8px; align-items: stretch; }
  .paste-input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 16px; color: var(--navy); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; outline: none; }
  .paste-input::placeholder { color: var(--grey-light); }
  .paste-input:focus { border-color: var(--navy); }
  .paste-btn { flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 700; color: #fff; background: var(--green); border: 0; border-radius: 999px; padding: 0 16px; cursor: pointer; white-space: nowrap; }
  .paste-btn:disabled { opacity: .7; cursor: default; }
  .paste-status { margin: 6px 4px 0; font-size: 13px; color: #a3352b; }
  .paste-status.ok { color: var(--green); font-weight: 600; }

  /* Spinner shown in the paste row's button while a link is being queued */
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -1px; margin-right: 6px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 18px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 600; color: var(--navy); background: var(--card); border: 1px solid #cfd5de; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* ── Shorts shelf ── */
  .shelf { padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
  .shelf-head { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .shelf-head .mark { width: 16px; height: 22px; border-radius: 5px; background: var(--gold); position: relative; }
  .shelf-head .mark::after { content: ""; position: absolute; left: 6px; top: 7px; border-style: solid; border-width: 4px 0 4px 6px; border-color: transparent transparent transparent #fff; }
  .shelf-row { display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; padding-bottom: 6px; scrollbar-width: thin; }
  .short { position: relative; flex: 0 0 110px; width: 110px; min-width: 0; scroll-snap-align: start; }
  .short .slink { color: inherit; text-decoration: none; display: block; }
  .short .sthumb { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; background: var(--thumb); }
  .short .sthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .short .stitle { margin-top: 7px; font-size: 13px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .short .sviews { margin-top: 2px; font-size: 12px; color: var(--grey); }
  .short .done-tag { left: 5px; top: 5px; font-size: 10px; padding: 1px 5px; letter-spacing: 0; }
  .short.transcribed .slink { opacity: .62; }
  /* Transcribe icon: bottom-right corner of the 9:16 thumbnail. It sits beside
     the link, not inside it; margin-top % is measured against the card WIDTH,
     so 177.78% is the thumbnail's height. */
  .short .tbtn { position: absolute; right: 5px; top: 0; margin-top: calc(177.78% - 31px); z-index: 2; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: rgba(11, 22, 40, .78); color: #fff; font: inherit; font-size: 12px; font-weight: 800; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .short .tbtn:hover { background: rgba(11, 22, 40, .95); }
  .short .tbtn.done { background: var(--green); }
  .short .tbtn.star { font-size: 15px; }
  .short .tbtn.star.on { color: var(--gold); }
  .short .tbtn .spin { margin: 0; }
  .short .tbtn:disabled { cursor: default; }
  .tnote { margin-top: 4px; font-size: 12px; font-weight: 600; color: #a3352b; }

  /* ── Main grid: borderless YouTube-style cards ── */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px 16px; }
  .card { min-width: 0; cursor: pointer; }
  .thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--thumb); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(11, 22, 40, .86); color: #fff; font-size: 12px; font-weight: 600; padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .done-tag { position: absolute; left: 8px; top: 8px; background: var(--green); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; }
  /* Hide ✕: top-right of every grid card and shelf card */
  .hide { position: absolute; top: 6px; right: 6px; z-index: 2; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: rgba(11, 22, 40, .74); color: #fff; font: inherit; font-size: 13px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hide:hover { background: rgba(11, 22, 40, .95); }
  .short .hide { top: 5px; right: 5px; width: 26px; height: 26px; font-size: 12px; }
  .info { display: flex; align-items: flex-start; gap: 10px; padding: 10px 2px 0; }
  .text { flex: 1 1 auto; min-width: 0; }
  .title { font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--navy); text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .meta { margin-top: 4px; color: var(--grey); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .tag { display: inline-block; vertical-align: 1px; margin-right: 6px; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; line-height: 1.4; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
  .tag.tips { background: #e7f5ef; color: #15724d; }
  .tag.stable-tour { background: #fdf4df; color: #8a6a14; }
  .tag.interview { background: #ebf0fa; color: #33508e; }
  .btn { flex: 0 0 auto; font: inherit; font-size: 12px; font-weight: 700; color: var(--green); background: transparent; border: 1.5px solid var(--green); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .btn:disabled { opacity: .75; cursor: default; }
  /* Star: ☆ = not queued, gold ★ = queued for the laptop to transcribe */
  .star-btn { flex: 0 0 auto; width: 40px; height: 40px; margin: -6px -6px 0 0; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--grey); font: inherit; font-size: 24px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .star-btn:hover { background: rgba(11, 22, 40, .06); }
  .star-btn.on { color: var(--gold); }
  /* Transcribed cards go grey, but their Transcript button stays full strength. */
  .card.transcribed .thumb, .card.transcribed .text { opacity: .62; }
  .card.transcribed .btn { background: var(--green); color: #fff; }

  /* ── Transcript panel (same overlay pattern as the player) ── */
  .tpanel { position: fixed; inset: 0; z-index: 60; background: rgba(5, 10, 20, .94); display: flex; align-items: center; justify-content: center; overscroll-behavior: contain;
    padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .tpanel-box { width: min(100%, 760px); max-height: 100%; display: flex; flex-direction: column; background: var(--card); color: var(--navy); border-radius: 14px; overflow: hidden; }
  .tpanel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .tpanel-title { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
  .tpanel-meta { margin-top: 3px; font-size: 12px; color: var(--grey); }
  .tpanel-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tpanel-actions .btn { font-size: 13px; padding: 7px 16px; }
  .tpanel-actions .btn.primary { background: var(--green); color: #fff; }
  .tpanel-text { flex: 1 1 auto; min-height: 120px; overflow-y: auto; overscroll-behavior: contain; padding: 14px 18px 20px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .tpanel-text.muted { color: var(--grey); }

  /* Small message bar for things that have no card to sit in */
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; max-width: calc(100% - 32px); background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 999px; box-shadow: 0 6px 20px rgba(11, 22, 40, .3); }

  /* ── In-page player overlay ── */
  html.player-open, html.player-open body { overflow: hidden; }
  .player { position: fixed; inset: 0; z-index: 50; background: rgba(5, 10, 20, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; overscroll-behavior: contain;
    padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .player-close { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
  .player-close:hover { background: rgba(255, 255, 255, .24); }
  .player-box { width: min(100%, 1100px, calc((100vh - 170px) * 16 / 9)); width: min(100%, 1100px, calc((100dvh - 170px) * 16 / 9)); }
  .player.is-short .player-box { width: min(100%, calc((100vh - 170px) * 9 / 16)); width: min(100%, calc((100dvh - 170px) * 9 / 16)); }
  .player-frame { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  .player.is-short .player-frame { aspect-ratio: 9 / 16; }
  .player-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .player-info { padding-top: 12px; color: #fff; }
  .player-title { font-size: 15px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .player-link { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--gold); }

  .state { text-align: center; color: var(--grey); padding: 64px 16px; font-size: 15px; }
  .state button { display: block; margin: 14px auto 0; }

  a:focus-visible, button:focus-visible, .paste-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 18px; }
    .short { flex-basis: 136px; width: 136px; }
  }
  @media (min-width: 900px) {
    body { font-size: 16px; }
    .top { padding-top: 24px; }
    .sub h1 { font-size: 32px; }
    .paste { max-width: 560px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 20px; }
    .title { font-size: 16px; }
    .shelf-row { gap: 14px; }
    .short { flex-basis: 160px; width: 160px; }
    .short .stitle { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="wordmark">Racing<span>Edge</span></div>
      <div class="pill-research">RESEARCH</div>
    </div>
  </header>

  <section class="sub">
    <h1>Video Feed</h1>
  </section>

  <form class="paste" id="pasteForm" novalidate>
    <input class="paste-input" id="pasteInput" type="url" inputmode="url" placeholder="Paste any YouTube link" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Paste any YouTube link to transcribe">
    <button class="paste-btn" id="pasteBtn" type="submit">★ Queue</button>
  </form>
  <div class="paste-status" id="pasteStatus" role="status" hidden></div>

  <div class="chips" id="chips" role="group" aria-label="Filter videos">
    <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
    <button class="chip" type="button" data-filter="tips" aria-pressed="false">Tips</button>
    <button class="chip" type="button" data-filter="stable-tour" aria-pressed="false">Stable tours</button>
    <button class="chip" type="button" data-filter="interview" aria-pressed="false">Interviews</button>
    <button class="chip" type="button" data-filter="starred" aria-pressed="false">★ Starred</button>
    <button class="chip" type="button" data-filter="not-transcribed" aria-pressed="false">Not transcribed</button>
  </div>

  <main>
    <section class="shelf" id="shelf" aria-labelledby="shelfTitle" hidden>
      <h2 class="shelf-head" id="shelfTitle"><span class="mark"></span>Shorts</h2>
      <div class="shelf-row" id="shelfRow"></div>
    </section>
    <div class="grid" id="grid"></div>
    <div class="state" id="state" hidden></div>
  </main>
</div>

<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="playerTitle" hidden>
  <button class="player-close" id="playerClose" type="button" aria-label="Close player">✕</button>
  <div class="player-box">
    <div class="player-frame" id="playerFrame"></div>
    <div class="player-info">
      <div class="player-title" id="playerTitle"></div>
      <a class="player-link" id="playerLink" target="_blank" rel="noopener">Open on YouTube</a>
    </div>
  </div>
</div>

<div class="tpanel" id="tpanel" role="dialog" aria-modal="true" aria-labelledby="tpanelTitle" hidden>
  <button class="player-close" id="tpanelClose" type="button" aria-label="Close transcript">✕</button>
  <div class="tpanel-box">
    <div class="tpanel-head">
      <h2 class="tpanel-title" id="tpanelTitle"></h2>
      <div class="tpanel-meta" id="tpanelMeta"></div>
      <div class="tpanel-actions">
        <button class="btn primary" id="tpanelCopy" type="button" disabled>Copy</button>
        <button class="btn" id="tpanelDownload" type="button" disabled>Download .txt</button>
      </div>
    </div>
    <div class="tpanel-text" id="tpanelText" tabindex="0"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var FEED_URL = '/.netlify/functions/get-youtube-feed';
  var HIDE_URL = '/.netlify/functions/hide-youtube-video';
  var TRANSCRIBE_URL = '/.netlify/functions/transcribe-youtube';
  var TAG_LABELS = { 'tips': 'TIPS', 'stable-tour': 'STABLE TOUR', 'interview': 'INTERVIEW' };

  var videos = [];
  var transcribed = {};
  var starred = {};   // ids waiting in the transcribe queue
  var hidden = {};
  var activeFilter = 'all';

  var grid = document.getElementById('grid');
  var shelf = document.getElementById('shelf');
  var shelfRow = document.getElementById('shelfRow');
  var state = document.getElementById('state');
  var chips = document.getElementById('chips');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  // A short message at the bottom of the screen, for things that have no
  // card to sit in (a hide that failed to save, a copy that failed).
  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 4500);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  // "12 min ago" / "12 hr ago" / "Yesterday" / "3 days ago" — card meta line.
  function agoCard(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return '';
    var mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
    if (mins < 60) return mins < 1 ? 'Just now' : mins + ' min ago';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' hr ago';
    if (hours < 48) return 'Yesterday';
    return Math.floor(hours / 24) + ' days ago';
  }

  // 843 -> "843 views", 8432 -> "8.4K views", 1234567 -> "1.2M views".
  function formatViews(n) {
    if (typeof n !== 'number' || !isFinite(n) || n < 0) return '';
    if (n < 1000) return plural(n, 'view');
    var unit = n < 1000000 ? 'K' : 'M';
    var v = n / (unit === 'K' ? 1000 : 1000000);
    var s = v < 10 ? (Math.floor(v * 10) / 10).toFixed(1).replace(/\.0$/, '') : String(Math.floor(v));
    return s + unit + ' views';
  }

  function watchUrl(id) { return 'https://www.youtube.com/watch?v=' + encodeURIComponent(id); }

  // ── In-page player ──
  // The iframe exists only while the overlay is open: closing removes it,
  // which is what stops playback. Nothing is embedded on page load.
  var player = document.getElementById('player');
  var playerFrame = document.getElementById('playerFrame');
  var playerTitle = document.getElementById('playerTitle');
  var playerLink = document.getElementById('playerLink');
  var playerClose = document.getElementById('playerClose');
  var lastFocus = null;

  function openPlayer(v) {
    lastFocus = document.activeElement;
    playerFrame.textContent = '';
    var frame = document.createElement('iframe');
    frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.videoId) + '?autoplay=1&playsinline=1&rel=0';
    frame.title = v.title || 'YouTube video';
    frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    frame.allowFullscreen = true;
    // YouTube refuses to play an embed that arrives with no referrer.
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    playerFrame.appendChild(frame);
    playerTitle.textContent = v.title || 'Untitled video';
    playerLink.href = watchUrl(v.videoId);
    player.classList.toggle('is-short', v.isShort === true);
    player.hidden = false;
    document.documentElement.classList.add('player-open');
    playerClose.focus();
  }

  function closePlayer() {
    if (player.hidden) return;
    playerFrame.textContent = '';
    player.hidden = true;
    document.documentElement.classList.remove('player-open');
    if (lastFocus && document.contains(lastFocus) && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  playerClose.addEventListener('click', closePlayer);
  // Backdrop only: a tap on the player, title or link must not close it.
  player.addEventListener('click', function (e) { if (e.target === player) closePlayer(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!tpanel.hidden) closeTranscript(); else closePlayer();
  });

  // A plain tap plays in the overlay; ctrl/cmd/shift/middle-click on a link
  // keeps its normal "open YouTube in a new tab" behaviour.
  function isPlainClick(e) { return e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey; }

  // Tries the sharpest thumbnail first and walks down a list until one loads:
  //   grid cards  — maxresdefault (1280px 16:9), then the stored thumbnail
  //   shelf cards — oar2 (YouTube's own vertical Shorts thumbnail), then
  //                 maxresdefault, then the stored thumbnail
  // YouTube answers a missing image with a tiny 120px grey placeholder that
  // still "loads", so a step is skipped on the image's size as well as on a
  // load error. The stored thumbnail is last and is accepted as it is.
  function thumbImg(v, kind) {
    var stored = (typeof v.thumbnail === 'string' && /^https:\/\//.test(v.thumbnail)) ? v.thumbnail : null;
    var base = 'https://i.ytimg.com/vi/' + encodeURIComponent(v.videoId) + '/';
    var sources = (kind === 'short' ? [base + 'oar2.jpg', base + 'maxresdefault.jpg'] : [base + 'maxresdefault.jpg']);
    if (stored) sources.push(stored);
    var img = el('img');
    img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    var i = 0;
    var next = function () {
      i++;
      if (i < sources.length) img.src = sources[i]; else img.remove();
    };
    img.addEventListener('error', next);
    img.addEventListener('load', function () {
      if (i < sources.length - 1 && img.naturalWidth <= 120) next();
    });
    img.src = sources[0];
    return img;
  }

  // Hide ✕: removes the card at once and tells the server, which keeps the
  // id in youtube:hidden so the video never comes back. If the save fails
  // the video is put back, so the page never shows something as hidden
  // that will reappear on the next load.
  function hideVideo(v, node) {
    hidden[v.videoId] = true;
    videos = videos.filter(function (x) { return x.videoId !== v.videoId; });
    node.remove();
    if (!shelfRow.children.length) shelf.hidden = true;
    if (!shelfRow.children.length && !grid.children.length) render();

    fetch(HIDE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ videoId: v.videoId }), keepalive: true })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .catch(function () {
        delete hidden[v.videoId];
        videos.push(v);
        videos.sort(byNewest);
        render();
        showToast('Couldn’t hide that video — it has been put back. Try again.');
      });
  }

  function hideButton(v, node) {
    var b = el('button', 'hide', '✕');
    b.type = 'button';
    b.title = 'Hide this video';
    b.setAttribute('aria-label', 'Hide: ' + (v.title || 'video'));
    b.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      hideVideo(v, node);
    });
    return b;
  }

  function byNewest(a, b) { return (Date.parse(b.publishedAt) || 0) - (Date.parse(a.publishedAt) || 0); }

  // ── Star to queue ──
  // A star puts the video in the transcribe queue (transcribe-youtube). The
  // laptop's worker drains the queue and stores the transcript; this page
  // never fetches captions itself. A card flips to "transcribed" when
  // get-youtube-feed reports its id in transcribedIds, on the next load.
  var transcriptCache = {};

  // POST to the queue. remove=true un-stars. Resolves the server's JSON
  // ({ status: 'queued' | 'removed' | 'done', ... }); rejects on any failure.
  function queueRequest(videoId, remove) {
    var body = remove ? { videoId: videoId, remove: true } : { videoId: videoId };
    return fetch(TRANSCRIBE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && (res.j.status === 'queued' || res.j.status === 'removed' || res.j.status === 'done')) return res.j;
        throw new Error(res.j.error || 'Queue request failed');
      });
  }

  // The ids currently queued — how stars survive a reload. A failure here
  // only means the stars are not shown; the feed still loads.
  function fetchQueue() {
    return fetch(TRANSCRIBE_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { return Array.isArray(j.queuedIds) ? j.queuedIds : []; })
      .catch(function () { return []; });
  }

  function paintStar(b, v) {
    var on = !!starred[v.videoId];
    b.textContent = on ? '★' : '☆';
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.title = on ? 'Starred — waiting for your laptop. Tap to un-star.' : 'Star to transcribe';
    b.setAttribute('aria-label', (on ? 'Un-star: ' : 'Star to transcribe: ') + (v.title || 'video'));
  }

  // Tap a star: the change shows at once and is then saved. If the save
  // fails the star goes back to how it was, so the page never shows a star
  // the queue does not have. `host` takes the inline failure note.
  function toggleStar(v, b, node, build, host) {
    var id = v.videoId;
    var turningOn = !starred[id];
    if (turningOn) starred[id] = true; else delete starred[id];
    paintStar(b, v);
    if (!turningOn && activeFilter === 'starred') render();
    queueRequest(id, !turningOn).then(function (j) {
      // Already transcribed (the worker got there first): flip the card.
      if (j.status === 'done') { delete starred[id]; markTranscribed(v, node, build); }
    }).catch(function () {
      if (turningOn) delete starred[id]; else starred[id] = true;
      if (document.contains(b)) { paintStar(b, v); cardNote(host, turningOn ? 'Couldn’t star — try again' : 'Couldn’t un-star — try again'); }
      else render();
    });
  }

  function fetchTranscript(videoId) {
    if (transcriptCache[videoId]) return Promise.resolve(transcriptCache[videoId]);
    return fetch(TRANSCRIBE_URL + '?videoId=' + encodeURIComponent(videoId), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        if (typeof j.text !== 'string') throw new Error('No transcript text');
        transcriptCache[videoId] = j;
        return j;
      });
  }

  // A short inline message under a card's text; it clears itself.
  function cardNote(host, text) {
    var old = host.querySelector('.tnote');
    if (old) old.remove();
    var n = el('div', 'tnote', text);
    n.setAttribute('role', 'status');
    host.appendChild(n);
    setTimeout(function () { n.remove(); }, 6000);
  }

  // Marks a video transcribed and redraws its card in place (grid or shelf).
  function markTranscribed(v, node, build) {
    transcribed[v.videoId] = true;
    if (activeFilter === 'not-transcribed' || activeFilter === 'starred') { render(); return; }
    if (node && node.parentNode) node.parentNode.replaceChild(build(v), node);
  }

  // ── Transcript panel ──
  var tpanel = document.getElementById('tpanel');
  var tpanelTitle = document.getElementById('tpanelTitle');
  var tpanelMeta = document.getElementById('tpanelMeta');
  var tpanelText = document.getElementById('tpanelText');
  var tpanelCopy = document.getElementById('tpanelCopy');
  var tpanelDownload = document.getElementById('tpanelDownload');
  var tpanelClose = document.getElementById('tpanelClose');
  var tpanelFocus = null;
  var tpanelCurrent = null;   // { videoId, title, date, text }

  // "Title of the video - 2026-11-17.txt": the video's upload date when the
  // feed knows it, otherwise the date the transcript was fetched.
  function transcriptFileName(title, date) {
    var name = String(title || 'YouTube transcript').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80).trim() || 'YouTube transcript';
    var t = Date.parse(date);
    var d = isNaN(t) ? new Date() : new Date(t);
    return name + ' - ' + d.toISOString().slice(0, 10) + '.txt';
  }

  function openTranscript(v) {
    tpanelFocus = document.activeElement;
    tpanelCurrent = null;
    tpanelTitle.textContent = v.title || 'Transcript';
    tpanelMeta.textContent = '';
    tpanelText.textContent = 'Loading transcript…';
    tpanelText.classList.add('muted');
    tpanelCopy.disabled = true; tpanelCopy.textContent = 'Copy';
    tpanelDownload.disabled = true;
    tpanel.hidden = false;
    document.documentElement.classList.add('player-open');
    tpanelClose.focus();

    var id = v.videoId;
    fetchTranscript(id).then(function (j) {
      if (tpanel.hidden) return;
      var title = v.title || j.title || 'YouTube video';
      tpanelCurrent = { videoId: id, title: title, date: v.publishedAt || j.fetchedAt, text: j.text };
      tpanelTitle.textContent = title;
      tpanelMeta.textContent = j.text.length.toLocaleString() + ' characters' + (j.kind === 'auto' ? ' · auto-generated captions' : j.kind === 'manual' ? ' · uploader’s captions' : '');
      tpanelText.textContent = j.text;
      tpanelText.classList.remove('muted');
      tpanelText.scrollTop = 0;
      tpanelCopy.disabled = false;
      tpanelDownload.disabled = false;
    }).catch(function () {
      if (tpanel.hidden) return;
      tpanelText.textContent = 'Couldn’t load this transcript. Close and try again.';
    });
  }

  function closeTranscript() {
    if (tpanel.hidden) return;
    tpanel.hidden = true;
    tpanelCurrent = null;
    tpanelText.textContent = '';
    document.documentElement.classList.remove('player-open');
    if (tpanelFocus && document.contains(tpanelFocus) && tpanelFocus.focus) tpanelFocus.focus();
    tpanelFocus = null;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      if (ok) resolve(); else reject(new Error('copy failed'));
    });
  }

  tpanelCopy.addEventListener('click', function () {
    if (!tpanelCurrent) return;
    copyText(tpanelCurrent.text).then(function () {
      tpanelCopy.textContent = 'Copied ✓';
      setTimeout(function () { tpanelCopy.textContent = 'Copy'; }, 2000);
    }).catch(function () { showToast('Couldn’t copy — select the text and copy it by hand.'); });
  });

  tpanelDownload.addEventListener('click', function () {
    if (!tpanelCurrent) return;
    var blob = new Blob([tpanelCurrent.title + '\n' + watchUrl(tpanelCurrent.videoId) + '\n\n' + tpanelCurrent.text + '\n'], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = transcriptFileName(tpanelCurrent.title, tpanelCurrent.date);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  tpanelClose.addEventListener('click', closeTranscript);
  // Backdrop only: a tap inside the panel must not close it.
  tpanel.addEventListener('click', function (e) { if (e.target === tpanel) closeTranscript(); });

  // ── Paste any YouTube link ──
  var pasteForm = document.getElementById('pasteForm');
  var pasteInput = document.getElementById('pasteInput');
  var pasteBtn = document.getElementById('pasteBtn');
  var pasteStatus = document.getElementById('pasteStatus');

  // The 11-character video id from a watch, shorts or youtu.be link (also
  // embed/live links and a bare id). null when there is none.
  function parseVideoId(input) {
    var s = String(input || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    var u;
    try { u = new URL(s); } catch (e) { return null; }
    var host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, '');
    var id = null;
    if (host === 'youtu.be') id = u.pathname.split('/')[1];
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else { var m = /^\/(?:shorts|embed|live|v)\/([^/?#]+)/.exec(u.pathname); if (m) id = m[1]; }
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  }

  function pasteMessage(text, ok) {
    pasteStatus.textContent = text || '';
    pasteStatus.classList.toggle('ok', !!ok);
    pasteStatus.hidden = !text;
  }

  pasteForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (pasteBtn.disabled) return;
    var id = parseVideoId(pasteInput.value);
    if (!id) { pasteMessage('That doesn’t look like a YouTube video link.'); return; }
    pasteMessage('');
    pasteBtn.disabled = true;
    pasteBtn.textContent = '';
    pasteBtn.appendChild(el('span', 'spin'));
    pasteBtn.appendChild(document.createTextNode('Queuing…'));
    var inFeed = videos.filter(function (x) { return x.videoId === id; })[0];
    queueRequest(id, false).then(function (j) {
      pasteInput.value = '';
      if (j.status === 'done') {
        // A transcript is already stored for this link: show it.
        delete starred[id];
        if (inFeed && !transcribed[id]) { transcribed[id] = true; render(); }
        else transcribed[id] = true;
        openTranscript(inFeed || { videoId: id, title: j.title || '' });
        return;
      }
      starred[id] = true;
      if (inFeed) render();
      pasteMessage('Queued — ready after your laptop next checks in.', true);
    }).catch(function () {
      pasteMessage('Couldn’t queue that link — try again.');
    }).then(function () {
      pasteBtn.disabled = false;
      pasteBtn.textContent = '★ Queue';
    });
  });
  pasteInput.addEventListener('input', function () { pasteMessage(''); });

  function buildCard(v) {
    var isDone = !!transcribed[v.videoId];
    var card = el('article', 'card' + (isDone ? ' transcribed' : ''));

    var thumb = el('div', 'thumb');
    var img = thumbImg(v, 'card');
    if (img) thumb.appendChild(img);
    if (v.duration) thumb.appendChild(el('span', 'dur', v.duration));
    if (isDone) thumb.appendChild(el('span', 'done-tag', 'TRANSCRIBED ✓'));
    thumb.appendChild(hideButton(v, card));
    card.appendChild(thumb);

    var info = el('div', 'info');
    var text = el('div', 'text');
    var title = el('a', 'title', v.title || 'Untitled video');
    title.href = watchUrl(v.videoId); title.target = '_blank'; title.rel = 'noopener';
    text.appendChild(title);

    var meta = el('div', 'meta');
    if (TAG_LABELS[v.category]) meta.appendChild(el('span', 'tag ' + v.category, TAG_LABELS[v.category]));
    var parts = [v.channelTitle || '', formatViews(v.viewCount), agoCard(v.publishedAt)].filter(Boolean);
    meta.appendChild(document.createTextNode(parts.join(' · ')));
    text.appendChild(meta);
    info.appendChild(text);

    // Not transcribed: a star (☆ / gold ★) that queues or un-queues the
    // video. Transcribed: a "Transcript" button that opens the panel. Neither
    // tap opens the player (the card's click handler ignores buttons).
    var btn;
    if (isDone) {
      btn = el('button', 'btn', 'Transcript');
      btn.addEventListener('click', function () { openTranscript(v); });
    } else {
      btn = el('button', 'star-btn');
      paintStar(btn, v);
      btn.addEventListener('click', function () { toggleStar(v, btn, card, buildCard, text); });
    }
    btn.type = 'button';
    btn.setAttribute('data-video-id', v.videoId);
    info.appendChild(btn);
    card.appendChild(info);

    card.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;
      if (e.target.closest('a') && !isPlainClick(e)) return;
      e.preventDefault();
      openPlayer(v);
    });
    return card;
  }

  // A Shorts shelf card: one link (so it is keyboard-reachable and can be
  // opened in a new tab), but a plain tap plays it in the overlay. The hide
  // ✕ sits beside the link, not inside it.
  function buildShort(v) {
    var isDone = !!transcribed[v.videoId];
    var wrap = el('div', 'short' + (isDone ? ' transcribed' : ''));
    var a = el('a', 'slink');
    a.href = watchUrl(v.videoId); a.target = '_blank'; a.rel = 'noopener';
    a.addEventListener('click', function (e) {
      if (!isPlainClick(e)) return;
      e.preventDefault();
      openPlayer(v);
    });

    var thumb = el('div', 'sthumb');
    var img = thumbImg(v, 'short');
    if (img) thumb.appendChild(img);
    if (isDone) { var tag = el('span', 'done-tag', '✓'); tag.title = 'Transcribed'; thumb.appendChild(tag); }
    a.appendChild(thumb);

    a.appendChild(el('div', 'stitle', v.title || 'Untitled video'));
    var views = formatViews(v.viewCount);
    if (views) a.appendChild(el('div', 'sviews', views));
    wrap.appendChild(a);
    wrap.appendChild(hideButton(v, wrap));

    // Bottom corner of the thumbnail, beside the link so a tap never opens
    // the player. Not transcribed: the star (☆ / gold ★). Transcribed: a
    // green "T" that opens the transcript panel.
    var tb;
    if (isDone) {
      tb = el('button', 'tbtn done', 'T');
      tb.title = 'Open transcript';
      tb.setAttribute('aria-label', 'Open transcript: ' + (v.title || 'video'));
    } else {
      tb = el('button', 'tbtn star');
      paintStar(tb, v);
    }
    tb.type = 'button';
    tb.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (transcribed[v.videoId]) openTranscript(v);
      else toggleStar(v, tb, wrap, buildShort, wrap);
    });
    wrap.appendChild(tb);
    return wrap;
  }

  function matches(v) {
    if (activeFilter === 'not-transcribed') { if (transcribed[v.videoId]) return false; }
    else if (activeFilter === 'starred') { if (!starred[v.videoId] || transcribed[v.videoId]) return false; }
    else if (activeFilter !== 'all' && v.category !== activeFilter) return false;
    return true;
  }

  function showState(text, withRetry) {
    state.textContent = text;
    if (withRetry) {
      var b = el('button', 'btn', 'Try again');
      b.type = 'button';
      b.addEventListener('click', load);
      state.appendChild(b);
    }
    state.hidden = false;
  }

  function clearLists() {
    grid.textContent = '';
    shelfRow.textContent = '';
    shelf.hidden = true;
  }

  // Shorts (isShort true) go to the shelf only; everything else to the grid.
  function render() {
    clearLists();
    state.hidden = true;
    if (!videos.length) { showState('No videos yet — the feed fills at 7am'); return; }
    var shown = videos.filter(matches);
    if (!shown.length) { showState(activeFilter === 'starred' ? 'Nothing starred — tap ☆ on a video to queue it for transcribing' : 'No videos match that filter'); return; }

    var shorts = shown.filter(function (v) { return v.isShort === true; });
    var normal = shown.filter(function (v) { return v.isShort !== true; });

    if (shorts.length) {
      var sfrag = document.createDocumentFragment();
      shorts.forEach(function (v) { sfrag.appendChild(buildShort(v)); });
      shelfRow.appendChild(sfrag);
      shelfRow.scrollLeft = 0;
      shelf.hidden = false;
    }
    var frag = document.createDocumentFragment();
    normal.forEach(function (v) { frag.appendChild(buildCard(v)); });
    grid.appendChild(frag);
  }

  function load() {
    clearLists();
    showState('Loading videos…');
    var feed = fetch(FEED_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    // The feed and the queue load together; fetchQueue never rejects.
    Promise.all([feed, fetchQueue()])
      .then(function (both) {
        var data = both[0];
        starred = {};
        both[1].forEach(function (id) { starred[id] = true; });
        // Hidden ids never render: they are dropped here, before anything is built.
        hidden = {};
        (Array.isArray(data.hiddenIds) ? data.hiddenIds : []).forEach(function (id) { hidden[id] = true; });
        videos = (Array.isArray(data.videos) ? data.videos : [])
          .filter(function (v) { return v && typeof v.videoId === 'string' && v.videoId && !hidden[v.videoId]; })
          .sort(byNewest);
        transcribed = {};
        (Array.isArray(data.transcribedIds) ? data.transcribedIds : []).forEach(function (id) { transcribed[id] = true; });

        render();
      })
      .catch(function () {
        clearLists();
        showState('Couldn’t load the feed. Check your connection and try again.', true);
      });
  }

  chips.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    activeFilter = chip.getAttribute('data-filter');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (c) {
      c.setAttribute('aria-pressed', c === chip ? 'true' : 'false');
    });
    if (videos.length) render();
  });

  load();
})();
</script>
</body>
</html>
