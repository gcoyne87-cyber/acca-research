<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RE Videos">
<title>Racing Edge — Video Feed</title>
<style>
  :root {
    --navy: #0b1628; --gold: #c9a84c; --green: #1e9e6b;
    --bg: #f5f7fb; --card: #ffffff; --line: #e5e9ef;
    --grey: #6b7686; --grey-light: #9aa3b0; --thumb: #dfe4ec;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--navy);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.4;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 1280px; margin: 0 auto; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 0 6px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy); }
  .wordmark span { color: var(--gold); }
  .pill-research { background: var(--navy); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 4px 9px; border-radius: 999px; }
  .updated { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--green); }
  .updated .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .updated.stale { color: var(--grey-light); }

  .sub { padding: 14px 0 14px; }
  .sub h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .sub p { margin: 4px 0 0; color: var(--grey); font-size: 14px; }

  .search { width: 100%; font: inherit; font-size: 16px; color: var(--navy); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 12px 18px; outline: none; }
  .search::placeholder { color: var(--grey-light); }
  .search:focus { border-color: var(--navy); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 18px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 600; color: var(--navy); background: var(--card); border: 1px solid #cfd5de; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* ── Shorts shelf ── */
  .shelf { padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
  .shelf-head { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .shelf-head .mark { width: 16px; height: 22px; border-radius: 5px; background: var(--gold); position: relative; }
  .shelf-head .mark::after { content: ""; position: absolute; left: 6px; top: 7px; border-style: solid; border-width: 4px 0 4px 6px; border-color: transparent transparent transparent #fff; }
  .shelf-row { display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; padding-bottom: 6px; scrollbar-width: thin; }
  .short { flex: 0 0 110px; width: 110px; min-width: 0; scroll-snap-align: start; color: inherit; text-decoration: none; display: block; }
  .short .sthumb { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; background: var(--thumb); }
  .short .sthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .short .stitle { margin-top: 7px; font-size: 13px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .short .sviews { margin-top: 2px; font-size: 12px; color: var(--grey); }
  .short .done-tag { left: 5px; top: 5px; font-size: 10px; padding: 1px 5px; letter-spacing: 0; }
  .short.transcribed { opacity: .62; }

  /* ── Main grid: borderless YouTube-style cards ── */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px 16px; }
  .card { min-width: 0; cursor: pointer; }
  .thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--thumb); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(11, 22, 40, .86); color: #fff; font-size: 12px; font-weight: 600; padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .done-tag { position: absolute; left: 8px; top: 8px; background: var(--green); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; }
  .info { display: flex; align-items: flex-start; gap: 10px; padding: 10px 2px 0; }
  .text { flex: 1 1 auto; min-width: 0; }
  .title { font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--navy); text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .meta { margin-top: 4px; color: var(--grey); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .tag { display: inline-block; vertical-align: 1px; margin-right: 6px; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; line-height: 1.4; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
  .tag.tips { background: #e7f5ef; color: #15724d; }
  .tag.stable-tour { background: #fdf4df; color: #8a6a14; }
  .tag.interview { background: #ebf0fa; color: #33508e; }
  .btn { flex: 0 0 auto; font: inherit; font-size: 12px; font-weight: 700; color: var(--green); background: transparent; border: 1.5px solid var(--green); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .btn small { font-size: 10px; font-weight: 600; opacity: .8; margin-left: 4px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .card.transcribed { opacity: .62; }
  .card.transcribed .btn { background: var(--green); color: #fff; }

  .state { text-align: center; color: var(--grey); padding: 64px 16px; font-size: 15px; }
  .state button { display: block; margin: 14px auto 0; }

  a:focus-visible, button:focus-visible, .search:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 18px; }
    .short { flex-basis: 136px; width: 136px; }
  }
  @media (min-width: 900px) {
    body { font-size: 16px; }
    .top { padding-top: 24px; }
    .sub h1 { font-size: 32px; }
    .search { max-width: 520px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 20px; }
    .title { font-size: 16px; }
    .shelf-row { gap: 14px; }
    .short { flex-basis: 160px; width: 160px; }
    .short .stitle { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="wordmark">Racing<span>Edge</span></div>
      <div class="pill-research">RESEARCH</div>
    </div>
    <div class="updated stale" id="updated" hidden><span class="dot"></span><span id="updatedText"></span></div>
  </header>

  <section class="sub">
    <h1>Video Feed</h1>
    <p id="countLine">Loading videos…</p>
  </section>

  <input class="search" id="search" type="search" placeholder="Search a horse, trainer or course…" autocomplete="off" aria-label="Search videos">

  <div class="chips" id="chips" role="group" aria-label="Filter videos">
    <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
    <button class="chip" type="button" data-filter="tips" aria-pressed="false">Tips</button>
    <button class="chip" type="button" data-filter="stable-tour" aria-pressed="false">Stable tours</button>
    <button class="chip" type="button" data-filter="interview" aria-pressed="false">Interviews</button>
    <button class="chip" type="button" data-filter="not-transcribed" aria-pressed="false">Not transcribed</button>
  </div>

  <main>
    <section class="shelf" id="shelf" aria-labelledby="shelfTitle" hidden>
      <h2 class="shelf-head" id="shelfTitle"><span class="mark"></span>Shorts</h2>
      <div class="shelf-row" id="shelfRow"></div>
    </section>
    <div class="grid" id="grid"></div>
    <div class="state" id="state" hidden></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var FEED_URL = '/.netlify/functions/get-youtube-feed';
  var TAG_LABELS = { 'tips': 'TIPS', 'stable-tour': 'STABLE TOUR', 'interview': 'INTERVIEW' };

  var videos = [];
  var transcribed = {};
  var activeFilter = 'all';
  var query = '';

  var grid = document.getElementById('grid');
  var shelf = document.getElementById('shelf');
  var shelfRow = document.getElementById('shelfRow');
  var state = document.getElementById('state');
  var countLine = document.getElementById('countLine');
  var updated = document.getElementById('updated');
  var updatedText = document.getElementById('updatedText');
  var searchBox = document.getElementById('search');
  var chips = document.getElementById('chips');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  // "12 min ago", "3 hours ago" — used for the header's last-run time.
  function agoShort(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    var mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    var hours = Math.floor(mins / 60);
    if (hours < 48) return plural(hours, 'hour') + ' ago';
    return plural(Math.floor(hours / 24), 'day') + ' ago';
  }

  // "12 min ago" / "12 hr ago" / "Yesterday" / "3 days ago" — card meta line.
  function agoCard(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return '';
    var mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
    if (mins < 60) return mins < 1 ? 'Just now' : mins + ' min ago';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' hr ago';
    if (hours < 48) return 'Yesterday';
    return Math.floor(hours / 24) + ' days ago';
  }

  // 843 -> "843 views", 8432 -> "8.4K views", 1234567 -> "1.2M views".
  function formatViews(n) {
    if (typeof n !== 'number' || !isFinite(n) || n < 0) return '';
    if (n < 1000) return plural(n, 'view');
    var unit = n < 1000000 ? 'K' : 'M';
    var v = n / (unit === 'K' ? 1000 : 1000000);
    var s = v < 10 ? (Math.floor(v * 10) / 10).toFixed(1).replace(/\.0$/, '') : String(Math.floor(v));
    return s + unit + ' views';
  }

  function watchUrl(id) { return 'https://www.youtube.com/watch?v=' + encodeURIComponent(id); }

  function thumbImg(v) {
    if (typeof v.thumbnail !== 'string' || !/^https:\/\//.test(v.thumbnail)) return null;
    var img = el('img');
    img.src = v.thumbnail; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    return img;
  }

  function buildCard(v) {
    var isDone = !!transcribed[v.videoId];
    var card = el('article', 'card' + (isDone ? ' transcribed' : ''));

    var thumb = el('div', 'thumb');
    var img = thumbImg(v);
    if (img) thumb.appendChild(img);
    if (v.duration) thumb.appendChild(el('span', 'dur', v.duration));
    if (isDone) thumb.appendChild(el('span', 'done-tag', 'TRANSCRIBED ✓'));
    card.appendChild(thumb);

    var info = el('div', 'info');
    var text = el('div', 'text');
    var title = el('a', 'title', v.title || 'Untitled video');
    title.href = watchUrl(v.videoId); title.target = '_blank'; title.rel = 'noopener';
    text.appendChild(title);

    var meta = el('div', 'meta');
    if (TAG_LABELS[v.category]) meta.appendChild(el('span', 'tag ' + v.category, TAG_LABELS[v.category]));
    var parts = [v.channelTitle || '', formatViews(v.viewCount), agoCard(v.publishedAt)].filter(Boolean);
    meta.appendChild(document.createTextNode(parts.join(' · ')));
    text.appendChild(meta);
    info.appendChild(text);

    // Part 3 wires both buttons. Until then "Transcribe" is disabled, and
    // "Transcript" only stops the tap from opening YouTube.
    var btn = el('button', 'btn');
    btn.type = 'button';
    btn.setAttribute('data-video-id', v.videoId);
    if (isDone) {
      btn.textContent = 'Transcript';
    } else {
      btn.textContent = 'Transcribe';
      btn.appendChild(el('small', null, 'soon'));
      btn.disabled = true;
    }
    info.appendChild(btn);
    card.appendChild(info);

    card.addEventListener('click', function (e) {
      if (e.target.closest('a, button')) return;
      window.open(watchUrl(v.videoId), '_blank', 'noopener');
    });
    return card;
  }

  // A Shorts shelf card: the whole card is one link to YouTube.
  function buildShort(v) {
    var isDone = !!transcribed[v.videoId];
    var a = el('a', 'short' + (isDone ? ' transcribed' : ''));
    a.href = watchUrl(v.videoId); a.target = '_blank'; a.rel = 'noopener';

    var thumb = el('div', 'sthumb');
    var img = thumbImg(v);
    if (img) thumb.appendChild(img);
    if (isDone) { var tag = el('span', 'done-tag', '✓'); tag.title = 'Transcribed'; thumb.appendChild(tag); }
    a.appendChild(thumb);

    a.appendChild(el('div', 'stitle', v.title || 'Untitled video'));
    var views = formatViews(v.viewCount);
    if (views) a.appendChild(el('div', 'sviews', views));
    return a;
  }

  function matches(v) {
    if (activeFilter === 'not-transcribed') { if (transcribed[v.videoId]) return false; }
    else if (activeFilter !== 'all' && v.category !== activeFilter) return false;
    if (query) {
      var hay = ((v.title || '') + ' ' + (v.channelTitle || '')).toLowerCase();
      if (hay.indexOf(query) === -1) return false;
    }
    return true;
  }

  function showState(text, withRetry) {
    state.textContent = text;
    if (withRetry) {
      var b = el('button', 'btn', 'Try again');
      b.type = 'button';
      b.addEventListener('click', load);
      state.appendChild(b);
    }
    state.hidden = false;
  }

  function clearLists() {
    grid.textContent = '';
    shelfRow.textContent = '';
    shelf.hidden = true;
  }

  // Shorts (isShort true) go to the shelf only; everything else to the grid.
  function render() {
    clearLists();
    state.hidden = true;
    if (!videos.length) { showState('No videos yet — the feed fills at 7am'); return; }
    var shown = videos.filter(matches);
    if (!shown.length) { showState('No videos match that search or filter'); return; }

    var shorts = shown.filter(function (v) { return v.isShort === true; });
    var normal = shown.filter(function (v) { return v.isShort !== true; });

    if (shorts.length) {
      var sfrag = document.createDocumentFragment();
      shorts.forEach(function (v) { sfrag.appendChild(buildShort(v)); });
      shelfRow.appendChild(sfrag);
      shelfRow.scrollLeft = 0;
      shelf.hidden = false;
    }
    var frag = document.createDocumentFragment();
    normal.forEach(function (v) { frag.appendChild(buildCard(v)); });
    grid.appendChild(frag);
  }

  function load() {
    state.hidden = true;
    countLine.textContent = 'Loading videos…';
    fetch(FEED_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        videos = (Array.isArray(data.videos) ? data.videos : [])
          .filter(function (v) { return v && typeof v.videoId === 'string' && v.videoId; })
          .sort(function (a, b) { return (Date.parse(b.publishedAt) || 0) - (Date.parse(a.publishedAt) || 0); });
        transcribed = {};
        (Array.isArray(data.transcribedIds) ? data.transcribedIds : []).forEach(function (id) { transcribed[id] = true; });

        countLine.textContent = plural(videos.length, 'racing video') + ' from the last 7 days · refreshes daily at 7am';

        var meta = data.meta || {};
        var ago = agoShort(meta.lastRunAt || meta.lastRun);
        updated.hidden = false;
        if (ago) { updated.classList.remove('stale'); updatedText.textContent = 'Updated ' + ago; }
        else { updated.classList.add('stale'); updatedText.textContent = 'Not updated yet'; }

        render();
      })
      .catch(function () {
        clearLists();
        countLine.textContent = 'Feed unavailable';
        showState('Couldn’t load the feed. Check your connection and try again.', true);
      });
  }

  searchBox.addEventListener('input', function () {
    query = searchBox.value.trim().toLowerCase();
    if (videos.length) render();
  });

  chips.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    activeFilter = chip.getAttribute('data-filter');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (c) {
      c.setAttribute('aria-pressed', c === chip ? 'true' : 'false');
    });
    if (videos.length) render();
  });

  load();
})();
</script>
</body>
</html>
