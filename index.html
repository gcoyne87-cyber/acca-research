<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixture Research</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#080f1e;min-height:100vh;color:#fff;padding:32px 20px}
.shell{max-width:900px;margin:0 auto}
.greeting{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,0.3);margin-bottom:6px}
.title{font-size:36px;font-weight:700;letter-spacing:-1px;margin-bottom:28px}
.title span{color:#c9a84c}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;background:#0e1e38;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 18px}
.date-arrow{background:none;border:none;color:rgba(255,255,255,0.4);font-size:24px;cursor:pointer;padding:0 8px;font-family:inherit;transition:color .15s}
.date-arrow:hover{color:#c9a84c}
.date-arrow:disabled{opacity:0.2;cursor:default}
.date-center{text-align:center;flex:1}
.date-display{font-size:17px;font-weight:700;color:#fff;display:block}
.date-sub{font-size:12px;color:rgba(255,255,255,0.3);margin-top:3px;display:block}
.league-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.ltab{padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-family:inherit;transition:all .15s}
.ltab:hover{border-color:rgba(201,168,76,0.4);color:rgba(201,168,76,0.8)}
.ltab.active{background:#c9a84c;color:#080f1e;border-color:#c9a84c}
.section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,0.2);margin-bottom:14px}
.fixtures-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.fixture-card{background:#0e1e38;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.fixture-card:hover{border-color:rgba(201,168,76,0.3)}
.fixture-teams{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.team{font-size:15px;font-weight:600;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.away{text-align:right}
.vs{font-size:12px;color:rgba(255,255,255,0.25);font-weight:600;flex-shrink:0;background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:6px;min-width:40px;text-align:center}
.vs.live{color:#4caf8a;background:rgba(76,175,138,0.1)}
.fixture-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.kickoff{font-size:13px;color:#c9a84c;font-weight:600}
.kickoff.live{color:#4caf8a}
.venue{font-size:11px;color:rgba(255,255,255,0.25)}
.loading{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3);font-size:15px}
.empty{text-align:center;padding:40px;color:rgba(255,255,255,0.25);font-size:14px;line-height:1.8}
.league-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;margin-top:24px}
.league-name{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.4)}
.count-badge{display:inline-block;font-size:10px;font-weight:700;background:rgba(201,168,76,0.2);color:#c9a84c;border-radius:20px;padding:2px 8px;margin-left:8px}
.error-msg{background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.2);border-radius:10px;padding:16px 20px;color:rgba(255,120,120,0.9);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="shell">
  <div class="greeting">Acca Research Tool</div>
  <div class="title">Fixture <span>Browser</span></div>
  <div class="date-nav">
    <button class="date-arrow" id="btn-prev" onclick="changeDate(-1)">&#8592;</button>
    <div class="date-center">
      <span class="date-display" id="date-display">Today</span>
      <span class="date-sub" id="date-sub"></span>
    </div>
    <button class="date-arrow" id="btn-next" onclick="changeDate(1)">&#8594;</button>
  </div>
  <div class="league-tabs">
    <button class="ltab active" onclick="filterLeague('all',this)">All Leagues</button>
    <button class="ltab" onclick="filterLeague('4328',this)">Premier League</button>
    <button class="ltab" onclick="filterLeague('4329',this)">Championship</button>
    <button class="ltab" onclick="filterLeague('4396',this)">League One</button>
    <button class="ltab" onclick="filterLeague('4397',this)">League Two</button>
    <button class="ltab" onclick="filterLeague('4330',this)">Scottish Prem</button>
    <button class="ltab" onclick="filterLeague('4395',this)">Scottish Champ</button>
    <button class="ltab" onclick="filterLeague('4669',this)">Scottish L1</button>
    <button class="ltab" onclick="filterLeague('4670',this)">Scottish L2</button>
  </div>
  <div id="fixtures-container"><div class="loading">Loading fixtures...</div></div>
</div>
<script>
// TheSportsDB league IDs — used for filtering the eventsday response
var TRACKED_LEAGUES = {
  '4328': 'Premier League',
  '4329': 'Championship',
  '4396': 'League One',
  '4397': 'League Two',
  '4330': 'Scottish Premiership',
  '4395': 'Scottish Championship',
  '4669': 'Scottish League One',
  '4670': 'Scottish League Two'
};

var allFixtures = [];
var currentLeague = 'all';
var currentDate = new Date();
var isLoading = false;
var pendingDate = null;

function formatDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function updateDateDisplay(){
  var today=new Date();today.setHours(0,0,0,0);
  var dc=new Date(currentDate);dc.setHours(0,0,0,0);
  var day=dc.toLocaleDateString('en-GB',{weekday:'long'});
  var dt=dc.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  var main=day,sub=dt;
  if(dc.getTime()===today.getTime()){main='Today';sub=day+', '+dt;}
  var tom=new Date(today);tom.setDate(today.getDate()+1);
  if(dc.getTime()===tom.getTime()){main='Tomorrow';sub=day+', '+dt;}
  document.getElementById('date-display').textContent=main;
  document.getElementById('date-sub').textContent=sub;
}

function setNavEnabled(enabled){
  document.getElementById('btn-prev').disabled=!enabled;
  document.getElementById('btn-next').disabled=!enabled;
}

function changeDate(days){
  var newDate=new Date(currentDate);
  newDate.setDate(newDate.getDate()+days);
  if(isLoading){pendingDate=newDate;return;}
  currentDate=newDate;
  loadFixtures();
}

function filterLeague(code,btn){
  currentLeague=code;
  document.querySelectorAll('.ltab').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  renderFixtures();
}

function formatKickoff(dateStr,timeStr){
  if(!timeStr||timeStr==='00:00:00'||!timeStr.trim()) return '';
  try{
    var dt=new Date(dateStr+'T'+timeStr+'Z');
    return dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return '';}
}

function isLive(status){
  return status==='1H'||status==='2H'||status==='HT'||status==='ET'||status==='PEN';
}

async function loadFixtures(){
  if(isLoading) return;
  isLoading=true;
  pendingDate=null;
  setNavEnabled(false);
  updateDateDisplay();
  document.getElementById('fixtures-container').innerHTML='<div class="loading">Loading fixtures...</div>';
  var dateStr=formatDate(currentDate);
  allFixtures=[];

  try{
    // Call TheSportsDB directly — no proxy needed, CORS is open on free tier
    var url='https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d='+dateStr+'&s=Soccer';
    var res=await fetch(url);
    var data=await res.json();
    var events=data.events||[];

    // Filter to only our tracked leagues
    allFixtures=events
      .filter(function(e){ return TRACKED_LEAGUES[e.idLeague]; })
      .map(function(e){
        return {
          id: e.idEvent,
          leagueId: e.idLeague,
          leagueName: e.strLeague,
          home: e.strHomeTeam,
          away: e.strAwayTeam,
          date: e.dateEvent,
          time: e.strTime||'',
          homeScore: e.intHomeScore,
          awayScore: e.intAwayScore,
          status: e.strStatus||'NS',
          venue: e.strVenue||''
        };
      });

    allFixtures.sort(function(a,b){
      if(!a.time||a.time==='00:00:00') return 1;
      if(!b.time||b.time==='00:00:00') return -1;
      return a.time.localeCompare(b.time);
    });

  }catch(e){
    document.getElementById('fixtures-container').innerHTML=
      '<div class="error-msg">Failed to load fixtures. Check your connection and try again.</div>';
    isLoading=false;
    setNavEnabled(true);
    return;
  }

  renderFixtures();
  isLoading=false;
  setNavEnabled(true);

  if(pendingDate){
    currentDate=pendingDate;
    pendingDate=null;
    loadFixtures();
  }
}

function renderFixtures(){
  var container=document.getElementById('fixtures-container');
  var filtered=currentLeague==='all'
    ?allFixtures
    :allFixtures.filter(function(f){return f.leagueId===currentLeague;});

  if(!filtered.length){
    container.innerHTML='<div class="empty">No fixtures on this date.<br>Use the arrows to find the next matchday.</div>';
    return;
  }

  var grouped={};var leagueOrder=[];
  filtered.forEach(function(f){
    if(!grouped[f.leagueId]){grouped[f.leagueId]=[];leagueOrder.push(f.leagueId);}
    grouped[f.leagueId].push(f);
  });

  var html='<div class="section-lbl">'+filtered.length+' fixture'+(filtered.length===1?'':'s')+' found</div>';

  leagueOrder.forEach(function(id){
    var name=TRACKED_LEAGUES[id]||grouped[id][0].leagueName||id;
    var fixtures=grouped[id];
    html+='<div class="league-header">';
    html+='<span class="league-name">'+name+'</span>';
    html+='<span class="count-badge">'+fixtures.length+'</span>';
    html+='</div><div class="fixtures-list">';
    fixtures.forEach(function(f){
      var live=isLive(f.status);
      var ft=f.status==='FT';
      var hasScore=f.homeScore!==null&&f.homeScore!==undefined&&f.homeScore!==''&&f.awayScore!==null&&f.awayScore!==undefined&&f.awayScore!=='';
      var scoreDisplay=(live||ft)&&hasScore?f.homeScore+'-'+f.awayScore:'vs';
      var kickoffDisplay=live?'LIVE':ft?'FT':formatKickoff(f.date,f.time);
      html+='<div class="fixture-card">';
      html+='<div class="fixture-teams">';
      html+='<div class="team">'+f.home+'</div>';
      html+='<div class="vs'+(live?' live':'')+'">'+scoreDisplay+'</div>';
      html+='<div class="team away">'+f.away+'</div>';
      html+='</div><div class="fixture-meta">';
      if(kickoffDisplay) html+='<div class="kickoff'+(live?' live':'')+'">'+kickoffDisplay+'</div>';
      if(f.venue) html+='<div class="venue">'+f.venue+'</div>';
      html+='</div></div>';
    });
    html+='</div>';
  });

  container.innerHTML=html;
}

window.addEventListener('DOMContentLoaded',function(){
  loadFixtures();
});
</script>
</body>
</html>
