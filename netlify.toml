[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."daily-build-trigger"]
  schedule = "30 9 * * *"

[functions."build-watchdog"]
  schedule = "0 10 * * *"

[functions."fetch-future-cards-trigger"]
  schedule = "0 23 * * *"

[functions."future-cards-watchdog"]
  schedule = "30 23 * * *"

[functions."fetch-horse-history-1-trigger"]
  schedule = "30 23 * * *"

[functions."fetch-horse-history-2-trigger"]
  schedule = "50 23 * * *"

[functions."racing-sweep-trigger"]
  schedule = "15 1 * * *"

# Class Drop nightly job — intent is 02:00 IRISH time. Cron here is UTC and
# Ireland is UTC+1 in summer / UTC in winter, so it fires at both 01:00 and
# 02:00 UTC; class-drop-nightly-background.js runs only when Irish time is
# 01:45-02:59 (once a night) and the other fire exits immediately. The same
# cron is set in class-drop-nightly-trigger.js's module.exports.config.
[functions."class-drop-nightly-trigger"]
  schedule = "0 1,2 * * *"

# Class Drop watchdog — intent is 02:30 Irish time, 30 min after the nightly job.
# Cron is UTC: 01:30 UTC = 02:30 Irish in summer (UTC+1), 02:30 UTC = 02:30 Irish
# in winter (UTC). The background job's window guard (02:20-02:54 Irish) exits
# cleanly for the off-season fire. Same cron in class-drop-watchdog-trigger.js.
[functions."class-drop-watchdog-trigger"]
  schedule = "30 1,2 * * *"

# Daily engines (goingtrip + trainer history batches) — SUBMIT, intent is
# 11:30 IRISH time. Cron is UTC: 10:30 UTC is 11:30 Irish in summer only, so
# it fires at 10:30 and 11:30 UTC; daily-engines-submit-background.js runs
# only when Irish time is 11:15-12:15 and once per day (batch:daily:{date}),
# so the other fire exits. Same cron in daily-engines-submit-trigger.js.
[functions."daily-engines-submit-trigger"]
  schedule = "30 10,11 * * *"

# Daily engines — COLLECT ticks every 15 minutes; the background job's guard
# does the windowing (11:45-15:05 Irish) and is silent outside it. Same cron
# in daily-engines-collect-trigger.js.
[functions."daily-engines-collect-trigger"]
  schedule = "*/15 * * * *"

# Trainer Form table refresh — LATE, intent is 21:30 IRISH time. Cron is
# UTC: 20:30 UTC is 21:30 Irish in summer only, so it fires at 20:30 and
# 21:30 UTC; the background job runs only when Irish time is 21:15-22:15 and
# once per slot (trainer-form-refresh:ran:{date}:late), so the other fire
# exits. Same cron in trainer-form-refresh-late-trigger.js.
[functions."trainer-form-refresh-late-trigger"]
  schedule = "30 20,21 * * *"

# Tomorrow's Hot Yard preview — intent is 22:00 IRISH time, after the 21:30
# trainer-form refresh has rewritten today's table. Cron is UTC: 21:00 UTC is
# 22:00 Irish in summer only, so it fires at 21:00 and 22:00 UTC;
# hotyard-nightly-background.js runs only when Irish time is 21:45-22:59 and
# once per night (hotyard-nightly:ran:{date}), so the other fire exits. Same
# cron in hotyard-nightly-trigger.js's module.exports.config.
[functions."hotyard-nightly-trigger"]
  schedule = "0 21,22 * * *"

# disabled 2026-10-06 — replaced by goingtrip engine; uncomment to restore
# [functions."form-summary-trigger"]
#   schedule = "0 4,6,8 * * *"

# disabled 2026-10-06 — replaced by goingtrip engine; uncomment to restore
# [functions."form-summary-watchdog"]
#   schedule = "30 9 * * *"

[functions."refresh-prices-trigger"]
  schedule = "0 6-21 * * *"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
