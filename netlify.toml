[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."daily-build-trigger"]
  schedule = "30 9 * * *"

[functions."build-watchdog"]
  schedule = "0 10 * * *"

[functions."fetch-future-cards-trigger"]
  schedule = "0 23 * * *"

[functions."future-cards-watchdog"]
  schedule = "30 23 * * *"

[functions."fetch-horse-history-1-trigger"]
  schedule = "30 23 * * *"

[functions."fetch-horse-history-2-trigger"]
  schedule = "50 23 * * *"

[functions."racing-sweep-trigger"]
  schedule = "15 1 * * *"

# Class Drop nightly job — intent is 02:00 IRISH time. Cron here is UTC and
# Ireland is UTC+1 in summer / UTC in winter, so it fires at both 01:00 and
# 02:00 UTC; class-drop-nightly-background.js runs only when Irish time is
# 01:45-02:59 (once a night) and the other fire exits immediately. The same
# cron is set in class-drop-nightly-trigger.js's module.exports.config.
[functions."class-drop-nightly-trigger"]
  schedule = "0 1,2 * * *"



# disabled 2026-10-06 — replaced by goingtrip engine; uncomment to restore
# [functions."form-summary-trigger"]
#   schedule = "0 4,6,8 * * *"

# disabled 2026-10-06 — replaced by goingtrip engine; uncomment to restore
# [functions."form-summary-watchdog"]
#   schedule = "30 9 * * *"

[functions."refresh-prices-trigger"]
  schedule = "0 6-21 * * *"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
