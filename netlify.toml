[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."daily-build-trigger"]
  schedule = "30 9 * * *"

[functions."fetch-future-cards-background"]
  schedule = "0 23 * * *"

[functions."fetch-horse-history-1-background"]
  schedule = "30 23 * * *"

[functions."fetch-horse-history-2-background"]
  schedule = "50 23 * * *"

[functions."form-summary-background"]
  schedule = "0 5,7,9 * * *"

[functions."refresh-prices-background"]
  schedule = "0 6-21 * * *"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
